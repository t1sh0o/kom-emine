<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kom-Emine Route Planner</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Mountain peaks -->
                    <path d="M4 32 L12 16 L18 24 L26 8 L36 32 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
                    <!-- Trail path -->
                    <path d="M6 30 Q12 22 18 26 Q24 18 34 28" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Peak marker -->
                    <circle cx="26" cy="8" r="3" fill="#16a34a"/>
                </svg>
            </div>
            <div>
                <h1>KOM-EMINE</h1>
                <p class="subtitle">555 km | Kom Peak to Cape Emine | E3 Trail</p>
            </div>
        </div>
    </header>

    <div class="filters">
        <span class="filter-label">Filter:</span>
        <label><input type="checkbox" id="filter-hut" checked> Huts</label>
        <label><input type="checkbox" id="filter-shelter" checked> Shelters</label>
        <label><input type="checkbox" id="filter-village" checked> Villages</label>
        <label><input type="checkbox" id="filter-town" checked> Towns</label>
        <label><input type="checkbox" id="filter-resort" checked> Resorts</label>
        <label><input type="checkbox" id="filter-finish" checked> Finish</label>
    </div>

    <section class="elevation-panel" id="elevation-panel">
        <canvas id="elevationChart"></canvas>
    </section>

    <main class="container">
        <section class="panel waypoints-panel">
            <h2>Waypoints <span id="waypoint-count"></span></h2>
            <div class="table-wrapper">
                <table id="waypoints-table">
                    <thead>
                        <tr>
                            <th>km</th>
                            <th>Name</th>
                            <th>Elev</th>
                            <th>Type</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="panel route-panel">
            <h2>Selected Route <span id="route-days"></span></h2>
            <div class="table-wrapper">
                <table id="route-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Segment</th>
                            <th>km</th>
                            <th>hrs</th>
                            <th>+m</th>
                            <th>-m</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="route-footer">
                <div class="route-totals" id="route-totals"></div>
                <button id="clear-btn" class="btn-clear">Clear</button>
            </div>
        </section>
    </main>

    <footer class="warnings" id="warnings"></footer>

    <!-- Segment Preview Modal -->
    <div id="segment-modal" class="modal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <header class="modal-header">
                <h3 id="modal-title">Day X: Start → End</h3>
                <button class="modal-close" onclick="closeSegmentModal()">&times;</button>
            </header>
            <div class="segment-stats" id="modal-stats"></div>
            <div class="segment-chart-wrapper">
                <canvas id="segmentChart"></canvas>
            </div>
            <div class="poi-lists" id="modal-pois"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
